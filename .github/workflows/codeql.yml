# Code scanning: CodeQL analyses the Kotlin and Java code on every push and pull request to
# main, and weekly. Findings show up under the repository's Security tab (for a private repository
# that needs GitHub Code Security; public repositories get it free).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      # CodeQL sees only what is compiled during this step: no outputs from Gradle's build cache, and
      # the Kotlin compiler in the traced Gradle process rather than in its own daemon.
      - name: Build
        run: >
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process
          :androidApp:assembleDebug :core:allTests
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
