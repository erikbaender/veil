# Code scanning: CodeQL analyses the Kotlin and Java code on every push and pull request to
# main, and weekly. Findings show up under the repository's Security tab (for a private repository
# that needs GitHub Code Security; public repositories get it free).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Build
        run: ./gradlew --no-daemon :androidApp:assembleDebug :core:allTests
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
